<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <title>Task Management</title>
</head>

<body>
    <section class=" max-w-[1500px] h-screen m-auto flex items-center justify-center">
        <article class="w-full min-h-[500px] flex flex-col justify-center gap-5 p-5 ">
            <h2 class=" text-2xl font-bold">Add Task</h2>
            <form id="form">
                <!-- Input Field -->
                <div class="mb-3">
                    <label for="success" class="block mb-2 text-sm font-medium">Task
                        Name</label>
                    <input type="text" id="input"
                        class=" bg-gray-50 border border-gray-300 text-sm rounded-lg block w-[60%] p-4 "
                        placeholder="HRD Homework">
                    <p id="textError" class="invisible mt-2 text-sm text-red-600 dark:text-red-500">
                        Please Fill Information</p>
                </div>

                <!-- Date Picker -->
                <div class="relative">
                    <label for="priority" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                        Date Selector</label>
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z" />
                        </svg>
                    </div>
                    <input datepicker id="datepicker" type="text"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-[60%] ps-10 p-4 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                        placeholder="Select date">
                    <p id="dateError" class="invisible mt-2 mb-2 text-sm text-red-600 dark:text-red-500">
                        Please Select Date</p>
                </div>


                <!-- Selected Options -->
                <div class="mb-6">
                    <label for="priority" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                        Priority</label>
                    <select id="priority"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-[60%] p-4 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                        <option selected value="null">Select Priority</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>

                <!-- Button -->
                <button type="button" id="btnTask"
                    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Add
                    Task</button>

            </form>

        </article>

        <!-- Right -->
        <article class="w-full min-h-[500px] flex flex-col gap-5 p-5">
            <h2 class=" text-2xl font-bold">Task List</h2>
            <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
                <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                        <tr>
                            <th scope="col" class="px-6 py-3">
                                Task NAME
                            </th>
                            <th scope="col" class="px-6 py-3">
                                DUE DATE
                            </th>
                            <th scope="col" class="px-6 py-3">
                                PRIORITY
                            </th>
                            <th scope="col" class="px-6 py-3">
                                STATUS
                            </th>
                        </tr>
                    </thead>
                    <tbody id="table">


                    </tbody>
                </table>
            </div>
        </article>
    </section>
    <script src="script.js"></script>
</body>

</html>
